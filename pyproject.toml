[build-system]
# hatch_build.py compiles the native library during every wheel build, so the
# CUDA 13 headers, NVRTC and link libraries are build requirements. Keep this
# list in sync with BUILD_REQUIREMENTS in hatch_build.py.
requires = [
    "hatchling>=1.27",
    "nvidia-cuda-runtime>=13.4,<13.5",
    "nvidia-cuda-nvrtc>=13.0.88,<13.1",
    "nvidia-cuda-crt>=13.4,<13.5",
    "nvidia-cuda-cccl>=13.3,<14",
    "nvidia-cublas>=13.7,<14",
    "nvidia-cudnn-cu13>=9.26,<10",
]
build-backend = "hatchling.build"

[project]
name = "umzi-native"
version = "0.0.2"
description = "Faster inference for umzi models/kernels on CUDA"
requires-python = ">=3.12"
dependencies = ["numpy>=2.5"]

[project.optional-dependencies]
exporter = ["resselt>=1.4.1"]
dev = [
    "nvidia-cuda-runtime>=13.4,<13.5",
    "nvidia-cuda-nvrtc>=13.0.88,<13.1",
    "nvidia-cuda-crt>=13.4,<13.5",
    "nvidia-cuda-cccl>=13.3,<14",
    "nvidia-cublas>=13.7,<14",
    "nvidia-cudnn-cu13>=9.26,<10",
    "nvidia-nvjitlink>=13.4,<13.5",
    "safetensors>=0.5.3",
    "ruff>=0.17",
    "pyrefly>=1.5",
    "hatchling>=1.27",
]

[tool.hatch.build.targets.sdist]
include = ["/src", "/native", "/hatch_build.py", "/README.md"]
exclude = ["*.dll", "*.so", "__pycache__"]

[tool.hatch.build.targets.wheel]
packages = ["src/umzi_native"]
# Only the library built by hatch_build.py is bundled.
exclude = ["*.dll", "*.so"]

# Loads hatch_build.py, which compiles the native library for each wheel.
[tool.hatch.build.targets.wheel.hooks.custom]

[tool.ruff]
line-length = 120
extend-exclude = [
    "env",
    "venv",
    ".pytest_cache",
    ".venv",
    "__pycache__",
    ".git",
    ".mypy_cache",
    ".vscode",
    ".ruff_cache",
    "**/Lib/**",
    "dist",
    "build",
    "_templates",
]
target-version = "py312"
src = ["src", "tests", "ci"]

[tool.ruff.format]
preview = true
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "S",
    "B",
    "T",
    "Q",
    "D",
    "RUF",
    "COM",
    "PTH",
    "ASYNC"
]
ignore = [
    "whitespace-before-punctuation",
    "undefined-local-with-import-star-usage",
    "undefined-local-with-import-star",
    "forward-annotation-syntax-error",
    "non-lowercase-variable-in-function",
    "missing-trailing-comma",
    "missing-trailing-period",  # first line should be period, most of my docstring will be LICENSE header so no thanks
    "blank-line-after-function",
    "non-imperative-mood",
    "CPY",
]
preview = true
extend-ignore = ["D", "subprocess-without-shell-equals-true", "suspicious-subprocess-import", "print"] # D -> Docstring missing for public function or method

[tool.ruff.lint.pydocstyle]
convention = "numpy"
ignore-decorators = ["typing.overload"]

[tool.ruff.lint.isort]
combine-as-imports = false
split-on-trailing-comma = true
required-imports = ["from __future__ import annotations"]
known-first-party = ["tests", "umzi_native"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["unused-import", "undefined-local-with-import-star", "missing-required-import", "missing-blank-line-after-summary"]
"tests/*.py" = ["assert", "missing-required-import", "D"]  # assert statement used in pytest
"pipelines/*" = ["T", "I", "subprocess-without-shell-equals-true", "D"]
"scripts/*.py" = ["undocumented-public-module", "print", "missing-required-import", "assert"]
"scripts/reference/*.py" = ["lowercase-imported-as-non-lowercase"]
